<rect x="206" y="17" width="10" height="10" rx="2" fill="#f97316"/><rect x="220" y="17" width="10" height="10" rx="2" fill="#f97316"/><rect x="234" y="17" width="10" height="10" rx="2" fill="#f97316"/><rect x="248" y="17" width="10" height="10" rx="2" stroke="#3b4d69"/>
