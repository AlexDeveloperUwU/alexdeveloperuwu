<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" fill="none">
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151e2c"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="icon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b4d69" stop-opacity="0"/><stop offset=".5" stop-color="#3b4d69" stop-opacity=".6"/><stop offset="1" stop-color="#3b4d69" stop-opacity="0"/></linearGradient>
  <linearGradient id="glowline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6" stop-opacity="0"/><stop offset=".35" stop-color="#3b82f6" stop-opacity=".8"/><stop offset=".65" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
<style>
  text{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'DejaVu Sans Mono',monospace}
  .sans{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
  .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{50%{opacity:.35;transform:scale(1.6)}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style></defs>

<g transform="translate(10 6)">
  <rect x=".5" y=".5" width="859" height="379" rx="12" fill="url(#card)" stroke="#2d3a54"/>
  <path d="M1 32V13a12 12 0 0 1 12-12h834a12 12 0 0 1 12 12v19z" fill="#2c394f"/>
  <path d="M1 32.5h858" stroke="#3b4d69"/>
  <text x="14" y="21" font-size="12" fill="#fff">~/about/ai-usage.md</text>
  <g transform="translate(798 10)">
    <rect width="12" height="12" rx="2" fill="#fbbf24"/><rect x="20" width="12" height="12" rx="2" fill="#10b981"/><rect x="40" width="12" height="12" rx="2" fill="#ef4444"/>
    <g font-size="9" font-weight="700" fill="#0f172a" fill-opacity=".5" text-anchor="middle"><text x="6" y="9.5">−</text><text x="26" y="9.5">□</text><text x="46" y="9.5">×</text></g>
  </g>
</g>
<text class="sans" x="40" y="74" font-size="14" fill="#cbd5e1">Every project and repository here is mine: the idea, the design, the decisions and the direction always come</text>
<text class="sans" x="40" y="98" font-size="14" fill="#cbd5e1">from me, and I review everything that ships. What changes from project to project is how much AI was involved,</text>
<text class="sans" x="40" y="122" font-size="14" fill="#cbd5e1">in any aspect: code, docs, design, planning or assets. The levels below describe that, and each project's README</text>
<text class="sans" x="40" y="146" font-size="14" fill="#cbd5e1">discloses its level. When a project sits between two levels, I disclose the higher one.</text>
<text x="40" y="188" font-size="13"><tspan fill="#7d8fa8">// </tspan><tspan fill="#60a5fa">Levels</tspan></text>

<rect x="40" y="204" width="54" height="24" rx="6" stroke="#10b981"/>
<text x="67" y="220" font-size="12" text-anchor="middle" fill="#10b981">None</text>
<rect x="170" y="211" width="10" height="10" rx="2" stroke="#3b4d69"/><rect x="184" y="211" width="10" height="10" rx="2" stroke="#3b4d69"/><rect x="198" y="211" width="10" height="10" rx="2" stroke="#3b4d69"/><rect x="212" y="211" width="10" height="10" rx="2" stroke="#3b4d69"/>
<text class="sans" x="244" y="220" font-size="13" fill="#7d8fa8">No AI involved in any part of the project.</text>

<rect x="40" y="238" width="102" height="24" rx="6" stroke="#60a5fa"/>
<text x="91" y="254" font-size="12" text-anchor="middle" fill="#60a5fa">Consulting</text>
<rect x="170" y="245" width="10" height="10" rx="2" fill="#60a5fa"/><rect x="184" y="245" width="10" height="10" rx="2" stroke="#3b4d69"/><rect x="198" y="245" width="10" height="10" rx="2" stroke="#3b4d69"/><rect x="212" y="245" width="10" height="10" rx="2" stroke="#3b4d69"/>
<text class="sans" x="244" y="254" font-size="13" fill="#7d8fa8">AI answered questions or helped plan. Everything built is mine.</text>

<rect x="40" y="272" width="86" height="24" rx="6" stroke="#f59e0b"/>
<text x="83" y="288" font-size="12" text-anchor="middle" fill="#f59e0b">Assisted</text>
<rect x="170" y="279" width="10" height="10" rx="2" fill="#f59e0b"/><rect x="184" y="279" width="10" height="10" rx="2" fill="#f59e0b"/><rect x="198" y="279" width="10" height="10" rx="2" stroke="#3b4d69"/><rect x="212" y="279" width="10" height="10" rx="2" stroke="#3b4d69"/>
<text class="sans" x="244" y="288" font-size="13" fill="#7d8fa8">AI produced some parts (code, docs or assets). I did the rest.</text>

<rect x="40" y="306" width="102" height="24" rx="6" stroke="#f97316"/>
<text x="91" y="322" font-size="12" text-anchor="middle" fill="#f97316">Co-created</text>
<rect x="170" y="313" width="10" height="10" rx="2" fill="#f97316"/><rect x="184" y="313" width="10" height="10" rx="2" fill="#f97316"/><rect x="198" y="313" width="10" height="10" rx="2" fill="#f97316"/><rect x="212" y="313" width="10" height="10" rx="2" stroke="#3b4d69"/>
<text class="sans" x="244" y="322" font-size="13" fill="#7d8fa8">AI produced a large share, under my direction and review.</text>

<rect x="40" y="340" width="94" height="24" rx="6" stroke="#ec4899"/>
<text x="87" y="356" font-size="12" text-anchor="middle" fill="#ec4899">Generated</text>
<rect x="170" y="347" width="10" height="10" rx="2" fill="#ec4899"/><rect x="184" y="347" width="10" height="10" rx="2" fill="#ec4899"/><rect x="198" y="347" width="10" height="10" rx="2" fill="#ec4899"/><rect x="212" y="347" width="10" height="10" rx="2" fill="#ec4899"/>
<text class="sans" x="244" y="356" font-size="13" fill="#7d8fa8">I gave the orders and prompts. Fully generated, reviewed by me, not written by me.</text>
</svg>
